version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
    ignore:
      # Evita upgrades major automáticos em todas as dependências.
      # Mantém propostas minor/patch, mas impede mudanças que possam quebrar
      # a toolchain Expo/React Native, o TypeScript suportado e o Node fixo no app.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: "develop"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]